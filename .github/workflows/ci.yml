name: CI

# Nothing under these paths is compiled, and no check is required to merge,
# so a docs or site only change skips the build instead of leaving it pending.
on:
  push:
    branches: [main, dev, 'codex/epic-*']
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main, dev, 'feature/**', 'codex/epic-*']
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - '**.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.head_ref == 'dev' || github.head_ref == 'main'
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # ubuntu-22.04 is the Linux release runner; package builds only run
        # on tags, so this is where a break on it shows before a release.
        os: [ubuntu-latest, ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-asio-sdk
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libdbus-1-dev
      - run: cargo check --workspace

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/setup-asio-sdk
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libdbus-1-dev
      - run: cargo test --workspace

  clippy:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libdbus-1-dev
      - run: cargo clippy --workspace --all-targets --exclude vibez-plugin-host -- -D warnings
      # vibez-plugin-host stays at lib-only lint coverage on purpose. Its tests
      # drive the VST3 vtable ABI directly, where a cast that looks redundant
      # on x86_64 is load-bearing on targets whose c_char is u8. Do not widen
      # this to --all-targets and "fix" what it then reports.
      - run: cargo clippy -p vibez-plugin-host -- -D warnings

  fmt:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
