name: Feature request
description: Suggest a new feature or an improvement to an existing one
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The musical or workflow goal, and where Vibez gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Vibez to do?
      description: Describe the behaviour you have in mind. A reference to how another DAW handles it is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you have tried
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Sketches, screenshots or links.
