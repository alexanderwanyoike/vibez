[package]
name = "vibez-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vibez-core = { workspace = true }
vibez-engine = { workspace = true }
vibez-audio-io = { workspace = true }
vibez-dsp = { workspace = true }
vibez-instruments = { workspace = true }
vibez-plugin-host = { workspace = true }
vibez-project = { workspace = true }
vibez-dropbox = { workspace = true }
iced = { workspace = true }
rtrb = { workspace = true }
serde = { workspace = true }
base64 = { workspace = true }
serde_json = { workspace = true }
notify = { workspace = true }
rfd = "0.15"
# Same client and TLS backend the Dropbox integration already links, so
# the release check adds no new transitive stack.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
dirs = "5"

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
x11rb = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "NSApplication", "NSGraphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry"] }

[[test]]
name = "native_plugin_gui"
harness = false

[target.'cfg(target_os = "macos")'.dev-dependencies]
clap-sys = "0.5"
